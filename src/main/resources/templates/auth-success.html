<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(#{success.title}, 'done', ~{::#content})}">
<body>
<div id="content" class="status">
	<svg class="status-icon success" viewBox="0 0 52 52" aria-hidden="true">
		<circle class="status-ring" cx="26" cy="26" r="23" pathLength="1"/>
		<path class="status-mark" d="M15 27l7 7 15-16" pathLength="1"/>
	</svg>
	<h1 th:text="#{success.heading}">You're signed in</h1>
	<p class="lead" th:text="#{success.lead}">Kodi will finish adding your account in a few seconds. You can close this page.</p>

	<section class="funding" th:if="${fundingUrl}" aria-labelledby="funding-title">
		<h2 id="funding-title" th:text="#{funding.title}">Help keep this sign-in working</h2>
		<p th:text="#{funding.text}">Hosting and Google's yearly security assessment cost money.</p>
		<th:block th:if="${fundingGoal}">
			<progress class="funding-bar" max="100" th:value="${fundingPercent}" th:text="${fundingPercent} + '%'">0%</progress>
			<p class="funding-progress" th:text="#{funding.progress(${fundingRaised},${fundingGoal})}">$0 of $0 raised this year</p>
		</th:block>
		<a class="button primary" th:href="${fundingUrl}" target="_blank" rel="noopener noreferrer" th:text="#{funding.button}">Support the project</a>
	</section>
</div>
</body>
</html>
