#logging.level.org.springframework.web: DEBUG

# Funding card on the auth-success page. Hidden when funding.url is empty.
funding.url=${FUNDING_URL:}
funding.goal=${FUNDING_GOAL:0}
funding.raised=${FUNDING_RAISED:0}

# Header carrying the client IP (last entry is used). Set CLIENT_IP_FORWARDED_HEADER to empty
# when no reverse proxy sets it, or clients could forge their address.
client-ip.forwarded-header=${CLIENT_IP_FORWARDED_HEADER:X-Forwarded-For}

# Requests per minute (0 disables). The refresh limit applies per IP and per refresh token.
rate-limit.pin=${RATE_LIMIT_PIN:10}
rate-limit.signin=${RATE_LIMIT_SIGNIN:20}
rate-limit.refresh.ip=${RATE_LIMIT_REFRESH_IP:60}
rate-limit.refresh.token=${RATE_LIMIT_REFRESH_TOKEN:10}
